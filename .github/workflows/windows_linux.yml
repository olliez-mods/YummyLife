name: Release Build

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Release Name
        required: true
        type: string
      prerelease:
        description: Pre-release
        required: false
        default: false
        type: boolean
      preview_build:
        description: Preview Build
        required: false
        default: false
        type: boolean
      dev_patch_url:
        description: URL to a patch file for development builds
        required: false
        type: string

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      PREVIEW_BUILD: ${{ inputs.preview_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install g++ make cmake libsdl1.2-dev libglu-dev libgl-dev g++-mingw-w64-i686-win32 curl libssl-dev libcurl4-openssl-dev wget
      - name: Install SDL
        run: |
          wget https://www.libsdl.org/release/SDL-devel-1.2.15-mingw32.tar.gz
          tar zxvf SDL-devel-1.2.15-mingw32.tar.gz
      - name: Install CPP-HTTPLib
        run: |
          mkdir -p ./CPP-HTTPLib
          wget -O ./CPP-HTTPLib/httplib.h https://raw.githubusercontent.com/yhirose/cpp-httplib/v0.14.3/httplib.h
      - name: Install OpenSSL
        run: |
          wget https://github.com/olliez-mods/OpenSSL-Prebuilt/releases/download/3.0.15-i686/openssl-3.0.15-i686.tar.gz
          tar zxvf openssl-3.0.15-i686.tar.gz
          cp -rf openssl-3.0.15-i686 openssl-3.0.15
      - name: Install Nlohmann/json
        run: |
          mkdir -p ./nlohmann
          wget -O ./nlohmann/json.hpp https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp
      - name: Apply Dev Patch (if exist)
        if: ${{ inputs.dev_patch_url != '' }}
        run: |
          wget -O dev_patch.patch "${{ inputs.dev_patch_url }}"
          git apply --ignore-whitespace dev_patch.patch
      - name: Build Scripts
        run: |
          ./build-release.sh
      - name: Upload Linux and Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-windows
          path: |
            ./relbuild/YummyLife_linux
            ./relbuild/YummyLife_windows.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    env:
      PREVIEW_BUILD: ${{ inputs.preview_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: brew install cmake sdl12-compat openssl@3
      - name: Vendored library headers
        run: |
          mkdir -p CPP-HTTPLib nlohmann
          curl -L -o CPP-HTTPLib/httplib.h https://raw.githubusercontent.com/yhirose/cpp-httplib/v0.14.3/httplib.h
          curl -L -o nlohmann/json.hpp https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp
      - name: Build macOS
        run: |
          cmake -B relbuild/macos -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build relbuild/macos -j 3
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: ./relbuild/macos/YummyLife_mac
          if-no-files-found: error

  release:
    needs: [build-linux, build-macos]
    if: ${{ always() && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_name }}
          release_name: ${{ inputs.release_name }}
          body: |
            ${{ inputs.preview_build && 'WARNING PREVIEW BUILD - MAY BE UNSTABLE' || 'How to install: https://github.com/olliez-mods/YummyLife/#installing-and-updating' }}
            ${{ inputs.preview_build && '' || 'Having issues: https://github.com/olliez-mods/YummyLife/#troubleshooting' }}
          prerelease: ${{ inputs.prerelease }}
      - name: Upload Linux
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/release-linux-windows/YummyLife_linux
          asset_name: YummyLife_linux
          asset_content_type: application/octet-stream
      - name: Upload Windows
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/release-linux-windows/YummyLife_windows.exe
          asset_name: YummyLife_windows.exe
          asset_content_type: application/octet-stream
      - name: Upload macOS
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/release-macos/YummyLife_mac
          asset_name: YummyLife_mac
          asset_content_type: application/octet-stream
