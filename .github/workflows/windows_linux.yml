name: Release Build

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Release Name
        required: true
        type: string
      prerelease:
        description: Pre-release
        required: false
        default: false
        type: boolean
      preview_build:
        description: Preview Build
        required: false
        default: false
        type: boolean
      dev_patch_url:
        description: URL to a patch file for development builds
        required: false
        type: string

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      PREVIEW_BUILD: ${{ inputs.preview_build }}
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install g++ make cmake libsdl1.2-dev libglu-dev libgl-dev g++-mingw-w64-i686-win32 curl libssl-dev libcurl4-openssl-dev wget
      - name: Libraries
        run: cd yummyLifeBuildScripts && ./setup-libs.sh
      - name: Apply Dev Patch (if exist)
        if: ${{ inputs.dev_patch_url != '' }}
        run: |
          wget -O dev_patch.patch "${{ inputs.dev_patch_url }}"
          git apply --ignore-whitespace dev_patch.patch
      - name: Build Scripts
        run: |
          ./build.sh release
      - name: Upload Linux and Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-windows
          path: |
            ./relbuild/YummyLife_linux
            ./relbuild/YummyLife_windows.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    env:
      PREVIEW_BUILD: ${{ inputs.preview_build }}
    steps:
      - uses: actions/checkout@v4
      # The Darwin branch of this script is brew (including libpng, which the
      # editor target needs) plus the vendored headers
      - name: Packages and libraries
        run: cd yummyLifeBuildScripts && ./setup-libs.sh
      - name: Apply Dev Patch (if exist)
        if: ${{ inputs.dev_patch_url != '' }}
        run: |
          curl -L -o dev_patch.patch "${{ inputs.dev_patch_url }}"
          git apply --ignore-whitespace dev_patch.patch
      - name: Build Scripts
        run: |
          ./build.sh release macos
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: ./relbuild/YummyLife_mac.zip
          if-no-files-found: error

  release:
    needs: [build-linux, build-macos]
    if: ${{ always() && needs.build-linux.result == 'success' && needs.build-macos.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_name }}
          release_name: ${{ inputs.release_name }}
          body: |
            ${{ inputs.preview_build && 'WARNING PREVIEW BUILD - MAY BE UNSTABLE' || 'How to install: https://github.com/olliez-mods/YummyLife/#installing-and-updating' }}
            ${{ inputs.preview_build && '' || 'Having issues: https://github.com/olliez-mods/YummyLife/#troubleshooting' }}
          prerelease: ${{ inputs.prerelease }}
      - name: Upload Linux
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/release-linux-windows/YummyLife_linux
          asset_name: YummyLife_linux
          asset_content_type: application/octet-stream
      - name: Upload Windows
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/release-linux-windows/YummyLife_windows.exe
          asset_name: YummyLife_windows.exe
          asset_content_type: application/octet-stream
      - name: Upload macOS
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/release-macos/YummyLife_mac.zip
          asset_name: YummyLife_mac.zip
          asset_content_type: application/zip
