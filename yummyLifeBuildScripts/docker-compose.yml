x-common: &common
  image: yummylife-buildscripts:latest
  build: .
  volumes:
    - ../:/app
  working_dir: /app
  user: "${DOCKER_USER:-root}"

services:
  setup:
    <<: *common
    working_dir: /app/yummyLifeBuildScripts
    entrypoint: ["bash", "./setup-libs.sh"]

  # Anything after the service name is passed straight through to build.sh, so
  # this one service covers every build it can make. build.sh requires a mode,
  # an OS and a target, so every one of these names all three:
  #   docker-compose run --rm build dev linux game
  #   docker-compose run --rm build dev windows server
  #   docker-compose run --rm build rel linux windows game
  build:
    <<: *common
    entrypoint: ["bash", "./build.sh"]

  shell:
    <<: *common
    command: ["/bin/bash"]
