x-common: &common
  image: yummylife-buildscripts:latest
  build: .
  volumes:
    - ../:/app
  working_dir: /app
  user: "${DOCKER_USER:-root}"

services:
  setup:
    <<: *common
    working_dir: /app/yummyLifeBuildScripts
    entrypoint: ["bash", "./setup-libs.sh"]

  # Anything after the service name is passed straight through to build.sh, so
  # this one service covers every build it can make. With nothing after it the
  # defaults apply, which in this container means the Linux and Windows clients:
  #   docker-compose run --rm build
  #   docker-compose run --rm build linux game
  #   docker-compose run --rm build windows server
  #   docker-compose run --rm build rel linux windows game
  build:
    <<: *common
    entrypoint: ["bash", "./build.sh"]

  shell:
    <<: *common
    command: ["/bin/bash"]
