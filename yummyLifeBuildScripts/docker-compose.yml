x-common: &common
  image: yummylife-buildscripts:latest
  build: .
  volumes:
    - ../:/app
  working_dir: /app
  user: "${DOCKER_USER:-root}"

services:
  setup:
    <<: *common
    working_dir: /app/yummyLifeBuildScripts
    entrypoint: ["bash", "./setup-libs.sh"]

  # Anything after the service name is passed straight through to build.sh, so
  # this one service covers every mode and target it accepts:
  #   docker-compose run --rm build                 both, dev
  #   docker-compose run --rm build linux           one target
  #   docker-compose run --rm build release linux   mode and target
  build:
    <<: *common
    entrypoint: ["bash", "./build.sh"]

  shell:
    <<: *common
    command: ["/bin/bash"]
